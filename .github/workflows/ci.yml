name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        jdk: [17, 21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: JAR sanity
        run: |
          unzip -p target/*.jar META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
          unzip -p target/*.jar META-INF/MANIFEST.MF | grep Automatic-Module-Name

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Secret scan
        run: |
          ! git grep -nE "BEGIN (RSA|OPENSSH|PRIVATE)|password\s*[:=]|api[_-]?key|AKIA[0-9A-Z]{16}" -- ':!*.md' .
      - name: Dependency tree check
        run: |
          mvn -B -q dependency:tree | tee deps.txt
          ! grep -qE "^\[INFO\] [+\\\\|].*:compile" deps.txt || true
      - name: Package smoke test (fresh consumer)
        run: |
          mvn -B -q install -DskipTests
