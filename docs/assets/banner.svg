<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <!-- magnifier ring -->
  <g transform="translate(90,60)" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="95" cy="95" r="70"/>
    <line x1="145" y1="145" x2="200" y2="200"/>
  </g>
  <!-- tx boundary inside the lens: outer box suspended, inner box separate -->
  <g transform="translate(115,118)" stroke-width="4" stroke-linecap="round" fill="none">
    <rect x="-40" y="-32" width="70" height="34" rx="5" stroke="#34d399" stroke-dasharray="6 4"/>
    <text x="-30" y="-10" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#34d399">outer</text>
    <line x1="-5" y1="2" x2="-5" y2="14" stroke="#fbbf24" stroke-dasharray="3 3"/>
    <rect x="-40" y="14" width="70" height="30" rx="5" stroke="#fbbf24"/>
    <text x="-28" y="33" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#fbbf24">inner</text>
    <rect x="45" y="-32" width="46" height="76" rx="5" fill="none" stroke="#f87171" stroke-dasharray="4 4"/>
    <text x="51" y="-10" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#f87171">tx?</text>
  </g>
  <text x="380" y="140" font-family="SF Mono, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f8fafc">spring-transaction-doctor</text>
  <text x="384" y="200" font-family="SF Mono, Menlo, Consolas, monospace" font-size="30" fill="#94a3b8">"silent rollback" — now you know why</text>
  <g transform="translate(384,236)">
    <rect width="196" height="34" rx="6" fill="#164e3f"/>
    <text x="14" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">proxy blind spots</text>
    <rect x="208" width="172" height="34" rx="6" fill="#0c4a5e"/>
    <text x="222" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#22d3ee">suspensions</text>
    <rect x="392" width="172" height="34" rx="6" fill="#3f3a15"/>
    <text x="406" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">rollback-only</text>
  </g>
</svg>
